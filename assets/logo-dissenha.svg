<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <!-- Dissenha Moulding Logo — Horizontal, for dark background -->

  <!-- Icon: Abstract geometric leaf/crown in copper -->
  <g transform="translate(5, 2) scale(0.9)">
    <!-- Far left blade -->
    <polygon points="0,65 22,28 36,42 14,80" fill="#c17a3a"/>
    <!-- Left chevron -->
    <polygon points="18,22 40,0 54,14 32,50" fill="#c17a3a"/>
    <!-- Center-left strip -->
    <polygon points="36,42 54,14 54,60 36,78" fill="#c17a3a"/>
    <!-- Center piece -->
    <polygon points="42,80 54,60 66,80 54,100" fill="#c17a3a"/>
    <!-- Center-right strip -->
    <polygon points="54,14 72,42 72,78 54,60" fill="#c17a3a"/>
    <!-- Right chevron -->
    <polygon points="68,0 90,22 76,50 54,14" fill="#c17a3a"/>
    <!-- Far right blade -->
    <polygon points="86,28 108,65 94,80 72,42" fill="#c17a3a"/>
    <!-- Bottom center fill -->
    <polygon points="36,78 54,60 72,78 54,100" fill="#c17a3a"/>
  </g>

  <!-- Text: DISSENHA — light for dark bg -->
  <text x="120" y="42"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="800" font-size="36" letter-spacing="3"
    fill="#e8e8e8">DISSENHA</text>

  <!-- Text: MOULDING -->
  <text x="120" y="80"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="800" font-size="36" letter-spacing="4"
    fill="#e8e8e8">MOULDING</text>
</svg>
